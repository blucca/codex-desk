[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-desk"
dynamic = ["version"]
description = "Find saved Codex answers and continue native conversations in a local workbench"
readme = "README.md"
keywords = ["codex", "codex-cli", "conversation-search", "local-workbench"]
requires-python = ">=3.11"
license = "MIT"

[project.urls]
Homepage = "https://github.com/blucca/codex-desk"
Issues = "https://github.com/blucca/codex-desk/issues"

[project.optional-dependencies]
control = ["websockets>=14,<17"]

[project.scripts]
codex-desk = "codex_desk.server:main"

[tool.setuptools]
packages = ["codex_desk"]

[tool.setuptools.dynamic]
version = {attr = "codex_desk.__version__"}

[tool.setuptools.package-data]
codex_desk = ["static/*"]
