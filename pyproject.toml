[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-desk"
version = "0.1.0.dev0"
description = "A local, project-bound daily workbench for native Codex sessions"
requires-python = ">=3.11"
license = "MIT"

[project.scripts]
codex-desk = "codex_desk.server:main"

[tool.setuptools.package-data]
codex_desk = ["static/*"]
