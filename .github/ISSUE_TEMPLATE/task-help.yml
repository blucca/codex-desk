name: Task help — find an earlier investigation
description: Find one earlier Codex decision and its own evidence, share the check it changed, or get help with the first blocked step.
title: "[Task help]: "
body:
  - type: markdown
    attributes:
      value: Which earlier Codex investigation do you need to find, and what do you need to decide now? Tell us one goal, the step reached, and the task’s own response or command/tool result you found, or the first blocker. Reading that evidence can finish the task; continuing is optional. A short neutral example is enough.
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system (optional)
      options:
        - Linux
        - macOS
        - Windows
        - WSL
        - Other
    validations:
      required: false
  - type: input
    id: codex-version
    attributes:
      label: Native Codex version (optional)
      description: If available, give the selected executable's version output or error in the shell used to launch Desk. Use codex --version for a standalone CLI, or the --version probe for the executable passed with --codex (see the README's Mac/Windows guides). Leave blank for the browser sample or before setup.
      placeholder: codex-cli 0.171.0
    validations:
      required: false
  - type: textarea
    id: desired-task
    attributes:
      label: The task you want to complete
      description: Name the earlier issue or decision and the check you need to make now. A remembered phrase, title or neutral example helps. For the sample or before installing, describe the investigation you hope to find.
      placeholder: Find last week's checkout retry decision so I can decide whether to repeat the timeout check.
    validations:
      required: true
  - type: dropdown
    id: reached-step
    attributes:
      label: Step reached
      options:
        - Install and launch
        - Index existing Codex history
        - Search saved content
        - Read original conversation
        - Read one task’s own evidence
        - Browse conversation titles
        - Continue/resume conversation
        - Save draft or follow-up
        - Run task
        - Tool approval or planning question
        - New-provider handoff
        - Return after closing/stopping
        - Other
        - Before installing
        - Browser sample only
    validations:
      required: true
  - type: textarea
    id: expected-result
    attributes:
      label: Expected result (optional)
      description: For a blocked step, add the expected result if it helps explain the difference.
      placeholder: Read the matching command output without changing the conversation or draft I already have open.
    validations:
      required: false
  - type: textarea
    id: actual-result
    attributes:
      label: Result or first blocked step
      description: Name the task response or command/tool result you read and which present-day investigation or check it changed or avoided. For a return, say what you reused for the next real task. For a blocker, give the first control and visible status. A useful original read can be the finished result.
      placeholder: I found the earlier retry decision, read that task’s command result, and skipped repeating the same timeout check.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps and controls used (optional)
      description: List the clicks in order, starting from the first screen or an open conversation.
      placeholder: |
        1. Find a decision in past work → Index existing Codex history.
        2. All indexed projects → enter a remembered phrase → Search.
        3. Read original conversation → Read containing task → Read this task’s evidence.
        4. Read full original item → Return to task evidence.
  - type: textarea
    id: step-context
    attributes:
      label: Context for this step (optional)
      description: For sample/preinstall feedback, say which client/history you intend to use. For search, give a neutral phrase or its length, project filter and index counts. For reading/continuing, say whether the saved folder exists. For return, note whether the browser and launch options stayed the same.
      placeholder: |
        Index: 12 seen / 12 indexed / 0 unchanged / 0 failed.
        Search: 11-character phrase, All indexed projects, 1 match.
        Reader: opened from content search; project folder no longer exists.
        Return: same browser and state directory; Draft saved locally was visible.
  - type: input
    id: desk-version
    attributes:
      label: Codex Desk version (optional)
      description: Output of uvx --prerelease allow codex-desk --version (or codex-desk --version for a Python installation).
      placeholder: 0.1.0a30
  - type: textarea
    id: error-text
    attributes:
      label: Short error text (optional)
      description: A short excerpt with keys, private URLs and project paths removed.
      render: text
