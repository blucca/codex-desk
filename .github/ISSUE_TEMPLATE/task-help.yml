name: Help with one project task
description: Get help finding a past answer, reading original history, or returning to a Codex task.
title: "[Task help]: "
body:
  - type: markdown
    attributes:
      value: Tell us the result you wanted, the control you used, and what happened. A short neutral example is enough.
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - WSL
        - Other
    validations:
      required: true
  - type: input
    id: codex-version
    attributes:
      label: Codex CLI version
      description: Output of codex --version in the shell used to launch Desk, or the error if it is unavailable.
      placeholder: codex-cli 0.171.0
    validations:
      required: true
  - type: textarea
    id: desired-task
    attributes:
      label: The task you want to complete
      description: Describe one answer or project/session outcome you want to reach.
      placeholder: Find a saved retry decision, read its original command output, then prepare the next task in the same conversation.
    validations:
      required: true
  - type: dropdown
    id: reached-step
    attributes:
      label: Step reached
      options:
        - Install and launch
        - Index existing Codex history
        - Search saved content
        - Read original conversation
        - Browse conversation titles
        - Continue/resume conversation
        - Save draft or follow-up
        - Run task
        - Tool approval or planning question
        - New-provider handoff
        - Return after closing/stopping
        - Other
    validations:
      required: true
  - type: textarea
    id: expected-result
    attributes:
      label: Expected result
      placeholder: Read the matching command output without changing the conversation or draft I already have open.
    validations:
      required: true
  - type: textarea
    id: actual-result
    attributes:
      label: Actual result
      description: Include the visible status or the point where the result differed.
      placeholder: The search returns a match, but Read original conversation stays on Reading original native conversation…
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps and controls used (optional)
      description: List the clicks in order, starting from the first screen or an open conversation.
      placeholder: |
        1. Find a decision in past work → Index existing Codex history.
        2. All indexed projects → enter a remembered phrase → Search.
        3. Read original conversation → Back to search.
  - type: textarea
    id: step-context
    attributes:
      label: Context for this step (optional)
      description: For search, give a neutral phrase or its length, project filter and index counts. For reading/continuing, say whether the saved folder exists. For return, note whether the browser and launch options stayed the same.
      placeholder: |
        Index: 12 seen / 12 indexed / 0 unchanged / 0 failed.
        Search: 11-character phrase, All indexed projects, 1 match.
        Reader: opened from content search; project folder no longer exists.
        Return: same browser and state directory; Draft saved locally was visible.
  - type: input
    id: desk-version
    attributes:
      label: Codex Desk version (optional)
      description: Output of codex-desk --version, or the version in your launch command.
      placeholder: 0.1.0a28
  - type: textarea
    id: error-text
    attributes:
      label: Short error text (optional)
      description: A short excerpt with keys, private URLs and project paths removed.
      render: text
