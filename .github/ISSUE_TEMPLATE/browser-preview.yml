name: Browser sample feedback
description: Share the step you tried in the no-install sample and whether it fits your own Codex work.
title: "[Browser sample]: "
body:
  - type: markdown
    attributes:
      value: "Try https://blucca.github.io/codex-desk/demo/: find retry budget, read the checkout task’s response, then inspect its printf sample-checkout command and reported result. Tell us the step reached or first blocker. Continuing and saving preparation are optional."
  - type: dropdown
    id: reached-step
    attributes:
      label: Step reached in the sample
      options:
        - Open recent sample work
        - Index and search for retry budget
        - Read original conversation
        - Read one task’s own evidence
        - Continue sample conversation
        - Save Plan draft or follow-ups
        - Reload and return
        - Install Desk for my own history
        - Other
    validations:
      required: true
  - type: textarea
    id: sample-result
    attributes:
      label: What happened?
      description: Tell us the result you reached or the first control that did not work as expected.
      placeholder: I found the retry-budget response and read that same task’s printf sample-checkout command and reported result.
    validations:
      required: true
  - type: textarea
    id: own-work
    attributes:
      label: Would this help with your own Codex work?
      description: Describe one earlier investigation and the check its original evidence would help you change or avoid. If you stopped before installing, tell us what got in the way.
      placeholder: I use the Codex CLI and want to find last week’s retry decision and its command output before repeating the timeout check.
    validations:
      required: true
  - type: input
    id: browser-os
    attributes:
      label: Browser and operating system (optional)
      placeholder: Safari on macOS, Chrome on Android, or Firefox on Linux
