name: Installed daily workbench
on:
  workflow_dispatch:
  pull_request:
    paths: ['codex_desk/**', 'examples/**', 'tests/**', 'pyproject.toml', '.github/workflows/daily-workbench.yml']
  push:
    branches: [main]
    paths: ['codex_desk/**', 'examples/**', 'tests/**', 'pyproject.toml', '.github/workflows/daily-workbench.yml']
permissions:
  contents: read
jobs:
  core-workflow:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONFAULTHANDLER: '1'
      DESK_SOURCE: ${{ github.workspace }}
      DESK_TEST_TEMP: ${{ github.workspace }}/temp
      TMPDIR: ${{ github.workspace }}/temp
      PIP_CACHE_DIR: ${{ github.workspace }}/temp/pip-cache
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/temp/playwright-browsers
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare workspace scratch
        run: mkdir -p temp/evidence
      - name: Check the core domain and native lifecycle
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Install the workbench and selected browser harness
        run: |
          python -m pip install . playwright==1.56.0
          python -m playwright install --with-deps chromium webkit
      - name: Use the installed daily workflow
        working-directory: temp
        env:
          DESK_USE_INSTALLED: '1'
          DESK_TEST_EVIDENCE: ${{ github.workspace }}/temp/evidence/daily-workflow
        run: python ../examples/check_native_evidence_preparation.py
      - name: Paste a genuine WebKit source artifact
        working-directory: temp
        env:
          DESK_USE_INSTALLED: '1'
          DESK_TEST_EVIDENCE: ${{ github.workspace }}/temp/evidence/native-clipboard
        run: python ../examples/check_copy_excerpt_artifact.py
      - name: Retain core workflow receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-daily-workbench
          path: temp/evidence
          if-no-files-found: ignore
          retention-days: 7
