name: Installed daily workbench
on:
  workflow_dispatch:
  pull_request:
    paths: ['codex_desk/**', 'examples/**', 'tests/**', 'pyproject.toml', '.github/workflows/daily-workbench.yml']
  push:
    branches: [main]
    paths: ['codex_desk/**', 'examples/**', 'tests/**', 'pyproject.toml', '.github/workflows/daily-workbench.yml']
permissions:
  contents: read
jobs:
  preparation-and-return:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DESK_SOURCE: ${{ github.workspace }}
      DESK_TEST_TEMP: ${{ github.workspace }}/temp
      TMPDIR: ${{ github.workspace }}/temp
      TEMP: ${{ github.workspace }}/temp
      TMP: ${{ github.workspace }}/temp
      PIP_CACHE_DIR: ${{ github.workspace }}/temp/pip-cache
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/temp/playwright-browsers
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare workspace scratch
        run: mkdir -p temp/installed-fixtures/tests temp/evidence
      - name: Test canonical source
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Install workbench and browser harness
        run: |
          python -m pip install . playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Check zero-install browser sample
        run: |
          python examples/build_browser_preview.py --out temp/static-preview/demo
          python examples/check_browser_preview.py --site temp/static-preview/demo --evidence temp/evidence/browser-preview
          python examples/build_browser_preview.py --embedded --out temp/static-preview/embedded
          python examples/check_browser_preview.py --site temp/static-preview/embedded --evidence temp/evidence/browser-preview-embedded
          python examples/check_browser_preview_links.py --site temp/static-preview/demo --embedded-site temp/static-preview/embedded --evidence temp/evidence/browser-preview-links
          python examples/build_browser_preview.py --session-reading-fixture --out temp/static-preview/reading
          python examples/build_browser_preview.py --embedded --session-reading-fixture --out temp/static-preview/reading-embedded
          python examples/check_browser_preview_session_reading.py --site temp/static-preview/reading --evidence temp/evidence/browser-preview-reading
          python examples/check_browser_preview_session_reading.py --site temp/static-preview/reading-embedded --embedded --evidence temp/evidence/browser-preview-reading-embedded
      - name: Check changed saved-work sample and first-new activity
        run: |
          python examples/check_browser_preview_new_activity.py --site temp/static-preview/reading --evidence temp/evidence/browser-preview-new-activity
          python examples/check_browser_preview_new_activity.py --site temp/static-preview/reading-embedded --embedded --evidence temp/evidence/browser-preview-new-activity-embedded
          python examples/check_browser_preview_changed_work.py --site temp/static-preview/demo --ordinary --evidence temp/evidence/browser-preview-changed-ordinary
          python examples/check_browser_preview_changed_work.py --site temp/static-preview/embedded --ordinary --embedded --evidence temp/evidence/browser-preview-changed-ordinary-embedded
          python examples/check_browser_preview_changed_work.py --site temp/static-preview/reading --evidence temp/evidence/browser-preview-changed-rich
          python examples/check_browser_preview_changed_work.py --site temp/static-preview/reading-embedded --embedded --evidence temp/evidence/browser-preview-changed-rich-embedded
      - name: Check installed daily workflows
        working-directory: temp
        run: |
          cp ../tests/browser_approval_context.py ../tests/browser_native_outcome_reading.py ../tests/browser_preparation_close_continuity.py ../tests/browser_pending_return.py ../tests/browser_read_prepared_continuity.py ../tests/browser_pending_interactions.py ../tests/browser_proposed_plan.py ../tests/browser_bound_recall_completion.py ../tests/browser_stop_task.py ../tests/browser_steering.py ../tests/browser_turn_changes.py ../tests/browser_native_steps.py ../tests/browser_prepared_queue_acceptance.py ../tests/browser_prepared_queue_editor.py ../tests/browser_captured_recall.py ../tests/browser_prepared_request_original.py ../tests/browser_prepared_live_output.py ../tests/browser_followup_editor.py ../tests/browser_prepared_request.py ../tests/test_turn_request_integration.py ../tests/test_navigation_controllers.py ../tests/browser_turn_recovery.py ../tests/browser_turn_request.py ../tests/test_approval_lifecycle.py ../tests/browser_missing_project.py ../tests/browser_recent_reader_scroll.py ../tests/browser_history_older.py ../tests/browser_recent_work.py ../tests/browser_preparation.py ../tests/browser_home.py ../tests/browser_home_read_guidance.py ../tests/browser_startup.py ../tests/browser_drafts.py ../tests/browser_followups.py ../tests/browser_organization.py ../tests/browser_collaboration.py ../tests/browser_recall.py ../tests/browser_native_recall.py ../tests/browser_recall_index_return.py ../tests/browser_bound_recall.py ../tests/browser_history_reader.py ../tests/browser_handoff.py ../tests/browser_handoff_navigation.py ../tests/browser_handoff_request.py ../tests/browser_selected_original.py ../tests/handoff_native_fixture.py installed-fixtures/tests/
          python - <<'PY'
          from pathlib import Path
          import codex_desk
          source = Path('../codex_desk').resolve()
          installed = Path(codex_desk.__file__).resolve()
          assert not installed.is_relative_to(source), installed
          print('Installed package:', installed)
          PY
          for fixture in approval_context native_outcome_reading preparation_close_continuity pending_return read_prepared_continuity pending_interactions proposed_plan bound_recall_completion stop_task steering turn_changes native_steps prepared_queue_acceptance captured_recall prepared_request_original prepared_live_output followup_editor prepared_request turn_recovery turn_request missing_project recent_reader_scroll history_older recent_work preparation home home_read_guidance startup drafts followups organization collaboration recall native_recall recall_index_return bound_recall history_reader handoff handoff_navigation handoff_request selected_original; do
            DESK_USE_INSTALLED=1 DESK_TEST_EVIDENCE="$PWD/evidence/$fixture" DESK_COLLABORATION_RECEIPT="$PWD/evidence/$fixture" python "installed-fixtures/tests/browser_$fixture.py"
          done
      - name: Check installed exact response, evidence preparation and saved lookup and task context
        working-directory: temp
        env:
          DESK_USE_INSTALLED: '1'
        run: |
          mkdir -p installed-fixtures/examples
          cp ../examples/check_native_new_activity.py ../examples/check_native_changed_work.py ../examples/check_native_session_reading.py ../examples/check_native_task_response.py ../examples/check_native_evidence_preparation.py ../examples/check_preparation_find.py ../examples/check_native_task_context.py installed-fixtures/examples/
          DESK_TEST_EVIDENCE="$GITHUB_WORKSPACE/temp/evidence/task-response" python installed-fixtures/examples/check_native_task_response.py
          DESK_TEST_EVIDENCE="$GITHUB_WORKSPACE/temp/evidence/evidence-preparation" python installed-fixtures/examples/check_native_evidence_preparation.py
          DESK_TEST_EVIDENCE="$GITHUB_WORKSPACE/temp/evidence/preparation-find" python installed-fixtures/examples/check_preparation_find.py
          DESK_TEST_EVIDENCE="$GITHUB_WORKSPACE/temp/evidence/task-context" python installed-fixtures/examples/check_native_task_context.py
          DESK_TEST_EVIDENCE="$GITHUB_WORKSPACE/temp/evidence/session-reading" python installed-fixtures/examples/check_native_session_reading.py
          DESK_TEST_EVIDENCE="$GITHUB_WORKSPACE/temp/evidence/session-reading-cold" python installed-fixtures/examples/check_native_session_reading.py --cold
          DESK_TEST_EVIDENCE="$GITHUB_WORKSPACE/temp/evidence/first-new-activity" python installed-fixtures/examples/check_native_new_activity.py
          DESK_TEST_EVIDENCE="$GITHUB_WORKSPACE/temp/evidence/changed-work" python installed-fixtures/examples/check_native_changed_work.py
      - name: Retain daily-workflow receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-daily-workbench
          path: temp/evidence
          if-no-files-found: ignore
          retention-days: 7
