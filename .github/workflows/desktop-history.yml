name: Desktop bundled native history acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop-history:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download the official Desktop bundle
        shell: bash
        run: |
          mkdir -p temp/desktop-volume temp/receipts
          curl --fail --location --retry 2 --max-time 240 \
            https://persistent.oaistatic.com/codex-app-prod/Codex.dmg \
            -o temp/Codex.dmg
          hdiutil attach temp/Codex.dmg -nobrowse -readonly -mountpoint "$PWD/temp/desktop-volume"
          find "$PWD/temp/desktop-volume" -maxdepth 8 -name codex -print
          for candidate in \
            "$PWD/temp/desktop-volume/ChatGPT.app/Contents/Resources/codex-cli/CodexCLI.app/Contents/MacOS/codex" \
            "$PWD/temp/desktop-volume/Codex.app/Contents/Resources/codex" \
            "$PWD/temp/desktop-volume/ChatGPT.app/Contents/Resources/codex"; do
            if test -x "$candidate"; then
              echo "DESKTOP_CODEX=$candidate" >> "$GITHUB_ENV"
              "$candidate" --version
              break
            fi
          done
          test -s "$GITHUB_ENV"
          find "$PWD/temp/desktop-volume" -maxdepth 2 -name '*.app' -print
          for app in "$PWD/temp/desktop-volume/"*.app; do
            /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist"
          done
      - name: Install the delivered preview
        env:
          PIP_CACHE_DIR: ${{ github.workspace }}/temp/pip-cache
          TMPDIR: ${{ github.workspace }}/temp
        run: python -m pip install --pre codex-desk==0.1.0a30
      - name: Read native saved history with the bundled executable
        env:
          DESK_TEST_TEMP: ${{ github.workspace }}/temp
        run: >-
          python examples/check_desktop_history.py
          --codex "$DESKTOP_CODEX"
          --work-dir "$PWD/temp/history-fixture"
          --receipt "$PWD/temp/receipts/desktop-history.json"
      - name: Upload the acceptance receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-history-receipt
          path: temp/receipts/
      - name: Release the read-only Desktop volume
        if: always()
        shell: bash
        run: hdiutil detach "$PWD/temp/desktop-volume" || true
